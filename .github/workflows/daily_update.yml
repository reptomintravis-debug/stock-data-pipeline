name: Daily Stock Price Update

on:
  schedule:
    # 日本時間 17:00（UTC 08:00）に毎日自動実行
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # 手動実行用ボタンの有効化

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Run update script
        run: python update_prices.py

      - name: Commit and push updated CSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add adjusted_ohlc_daily_prices.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Update daily stock prices" && git push)
